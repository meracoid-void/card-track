<h2 mat-dialog-title>Invite Participant</h2>
<mat-dialog-content>
  <p>Enter the email address of the person you want to invite to this cube.</p>
  <form [formGroup]="inviteForm" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Email Address</mat-label>
      <input matInput formControlName="email" placeholder="Enter email address" required>
      <mat-error *ngIf="inviteForm.get('email')?.hasError('required')">
        Email is required
      </mat-error>
      <mat-error *ngIf="inviteForm.get('email')?.hasError('email')">
        Please enter a valid email address
      </mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()" [disabled]="loading">Cancel</button>
  <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="loading || inviteForm.invalid">
    <mat-spinner *ngIf="loading" diameter="20" class="button-spinner"></mat-spinner>
    <span *ngIf="!loading">Send Invite</span>
  </button>
</mat-dialog-actions>
