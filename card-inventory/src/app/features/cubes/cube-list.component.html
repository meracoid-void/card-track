<div class="cube-list-container">
  <div class="header">
    <h1>My Cubes</h1>
    <button mat-raised-button color="primary" (click)="createNewCube()">
      <mat-icon>add</mat-icon>
      Create New Cube
    </button>
  </div>

  <div *ngIf="loading" class="loading-container">
    <mat-spinner diameter="50"></mat-spinner>
  </div>

  <div *ngIf="!loading && cubes.length === 0" class="empty-state">
    <mat-icon class="empty-icon">inventory_2</mat-icon>
    <h2>No cubes yet</h2>
    <p>Create your first Yu-Gi-Oh cube to get started with drafting!</p>
    <button mat-raised-button color="primary" (click)="createNewCube()">
      Create Your First Cube
    </button>
  </div>

  <div *ngIf="!loading && cubes.length > 0" class="cubes-grid">
    <mat-card class="cube-card" *ngFor="let cube of cubes" (click)="navigateToCube(cube.id)">
      <mat-card-header>
        <mat-card-title>{{ cube.name }}</mat-card-title>
        <mat-card-subtitle *ngIf="cube.description">{{ cube.description }}</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <p class="cube-date">Created: {{ cube.createdAt | date:'mediumDate' }}</p>
      </mat-card-content>
      <mat-card-actions class="card-actions">
        <button mat-button (click)="editCube(cube); $event.stopPropagation()">
          <mat-icon>edit</mat-icon>
          Edit
        </button>
        <button mat-button color="warn" (click)="deleteCube(cube); $event.stopPropagation()">
          <mat-icon>delete</mat-icon>
          Delete
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
